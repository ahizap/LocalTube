name: Build and Release LocalTube

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.os }} Bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LocalTube-Windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: LocalTube-Linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: LocalTube-macOS-x64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Vue SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      # Download static FFmpeg on Windows
      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegBin = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination "bin\ffmpeg.exe"
          Copy-Item $ffprobeBin.FullName -Destination "bin\ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"

      # Download static FFmpeg on Linux
      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          curl -L "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" | tar -xJ --strip-components=1 -C bin/
          chmod +x bin/ffmpeg bin/ffprobe

      # Download static FFmpeg on macOS
      - name: Download FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip ffmpeg.zip -d bin/
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o ffprobe.zip
          unzip ffprobe.zip -d bin/
          chmod +x bin/ffmpeg bin/ffprobe
          rm -f ffmpeg.zip ffprobe.zip

      - name: Build Standalone Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --console `
            --name "LocalTube" `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "backend;backend" `
            --add-binary "bin/ffmpeg.exe;bin" `
            --add-binary "bin/ffprobe.exe;bin" `
            run_app.py

      - name: Build Standalone Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --console \
            --name "LocalTube" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "backend:backend" \
            --add-binary "bin/ffmpeg:bin" \
            --add-binary "bin/ffprobe:bin" \
            run_app.py

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LocalTube/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package Artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" LocalTube

      - name: Package Artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}.zip" LocalTube

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
